<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nomade — Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">VulnApp</a>

    <ul class="nav-links">
        <li><a href="index.html" class="active">Accueil</a></li>
        <li><a href="page-about.html">À propos</a></li>
        <li><a href="page-contact.html">Contact</a></li>
    </ul>

    <div class="nav-auth">
        <button class="btn-primary btn-nav" id="loginBtn">Se connecter</button>
    </div>
</nav>


<main>
  <div class="contact-wrap">
    <h2>Contact</h2>
    <p>Une question, une suggestion ou un problème ? Écrivez-nous.</p>

    <div class="form-group">
      <label for="c-name">Nom</label>
      <input type="text" id="c-name" placeholder="Votre nom" />
    </div>
    <div class="form-group">
      <label for="c-email">Adresse e-mail</label>
      <input type="email" id="c-email" placeholder="vous@example.com" />
    </div>
    <div class="form-group">
      <label for="c-msg">Message</label>
      <textarea id="c-msg" rows="5" placeholder="Décrivez votre demande..."></textarea>
    </div>

    <button class="btn-primary" onclick="sendContact()" id="btn-contact">Envoyer</button>

    <div class="form-success" id="contact-success">
      Message envoyé — nous vous répondrons sous 48 h.
    </div>
  </div>
</main>

<script src="shared.js"></script>

</body>
</html>
